# Install once:  pip install pre-commit  &&  pre-commit install
# Runs before every commit and blocks it if a secret or real address leaks.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: block-real-infra
        name: Block real lab addresses and identifiers
        entry: scripts/check-sanitized.sh
        language: script
        pass_filenames: true

      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        files: \.tf$
        pass_filenames: false
